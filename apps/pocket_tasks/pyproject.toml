[project]
name = "pocket-tasks"
version = "0.1.0"
description = "A task manager built with PyNativeX."
requires-python = ">=3.11"
dependencies = ["pynativex>=0.1.0a1"]

[tool.pynativex]
app_id = "dev.pynativex.pockettasks"
name = "Pocket Tasks"
version = "0.1.0"
entry = "pocket_tasks.main:app"

[tool.pynativex.android]
min_sdk = 24
target_sdk = 36
abis = ["arm64-v8a"]
permissions = []
