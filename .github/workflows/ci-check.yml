name: CI Checks

on:
  push:
    branches: [ main, pypi-packaging ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install .[dev]
      - name: Run linting
        run: ruff check .
      - name: Run tests
        run: pytest
