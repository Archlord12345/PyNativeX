name: Ingest b64 gallery parts
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ingest-b64.yml
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download and commit parts
        run: |
          curl -fsSL "https://litter.catbox.moe/lczs2k.py" -o /tmp/ingest.py
          python3 /tmp/ingest.py
