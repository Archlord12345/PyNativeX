[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pynativex"
version = "0.1.0a1"
description = "Build native mobile applications with Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kernel Forge" }]
keywords = ["android", "ios", "mobile", "native", "python"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/pynativex/pynativex"
Repository = "https://github.com/pynativex/pynativex.git"
Documentation = "https://pynativex.github.io"

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.11", "mypy>=1.15"]
docs = ["mkdocs-material>=9.6", "mkdocstrings[python]>=0.29"]

[project.scripts]
pynativex = "pynativex.cli:main"
pynative = "pynativex.cli:main"

[tool.setuptools.packages.find]
where = ["sdk/python"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["apps/pocket_tasks", "apps/photo_gallery"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pynativex"]
mypy_path = "sdk/python"
